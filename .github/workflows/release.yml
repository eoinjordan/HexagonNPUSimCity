name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/release.mjs --check-version
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Require all deliverables and generate checksums
        run: node tools/release.mjs --checksums
      - name: Publish assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A release may already exist for the tag (created by hand, or by an
        # earlier run that failed after this point). Uploading in that case
        # keeps releases/latest/download/<asset> working, which is what the
        # printed QR codes resolve through.
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Hexagon NPU SimCity $RELEASE_TAG" \
              --notes-file docs/release-notes.md release/*
          fi